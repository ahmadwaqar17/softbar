name: Build on macOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check installer syntax
        run: bash -n install.sh
      - name: Extract Swift source from installer
        run: sed -n "/<<'EOF_SWIFT'/,/^EOF_SWIFT$/p" install.sh | sed '1d;$d' > SoftBar.swift
      - name: Compile (Apple Silicon)
        run: |
          swiftc --version
          swiftc -O SoftBar.swift -o SoftBar-arm64 -framework Cocoa -framework Carbon
          file SoftBar-arm64
      - name: Compile (Intel, macOS 10.15+ - e.g. 2019 MacBook Pro)
        run: |
          swiftc -O -target x86_64-apple-macos10.15 SoftBar.swift -o SoftBar-x86_64 -framework Cocoa -framework Carbon
          file SoftBar-x86_64
      - name: Run full installer
        run: bash install.sh
      - name: Check app installed and running
        run: |
          sleep 5
          ls -la ~/Applications/SoftBar.app/Contents/MacOS/
          codesign -dv ~/Applications/SoftBar.app 2>&1 | head -3
          pgrep -lx SoftBar
      - name: Screenshot right after install
        run: screencapture -x screenshot.png || true
      - name: Grant Accessibility on the CI machine only, close Settings
        run: |
          osascript -e 'quit app "System Settings"' || true
          BIN="$HOME/Applications/SoftBar.app"
          for DB in "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "/Library/Application Support/com.apple.TCC/TCC.db"; do
            sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,indirect_object_identifier,flags) VALUES ('kTCCServiceAccessibility','com.softbar.app',0,2,4,1,'UNUSED',0);" || true
          done
          pkill -x SoftBar || true; sleep 1; open "$BIN"; sleep 6
      - name: Screenshot with permission
        run: screencapture -x screenshot-granted.png || true
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: screenshot*.png
